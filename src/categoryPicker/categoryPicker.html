<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Select Category</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1e1e2e;
      color: #cdd6f4;
      padding: 16px;
      min-height: 100vh;
    }
    h2 {
      font-size: 16px;
      margin-bottom: 12px;
      text-align: center;
      color: #cdd6f4;
    }
    .category-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .category-btn {
      background: #313244;
      border: 1px solid #45475a;
      border-radius: 8px;
      padding: 10px 14px;
      color: #cdd6f4;
      font-size: 14px;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s;
    }
    .category-btn:hover {
      background: #45475a;
    }
  </style>
</head>
<body>
  <h2 id="title"></h2>
  <p id="tooltip_1" style="font-size: 12px; color: #cdd6f4; margin-bottom: 16px; text-align: center;"></p>
  <div class="category-list" id="categoryList"></div>
  <p id="tooltip_2" style="font-size: 10px; color: #cdd6f4; margin-top: 16px; text-align: center;"></p>
  <script type="module" src="categoryPicker.js"></script>
</body>
</html>
