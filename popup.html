<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Tab Book</title>
    <link rel="stylesheet" href="css/popup.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
  </head>
  <body>
    <div id="loading" style="text-align: center; padding: 1em" data-i18n="loading">로딩 중...</div>

    <div id="category-picker" style="display: none; padding: 6px 0;">
      <h3 id="picker-title" style="font-size: 15px; margin-bottom: 8px; text-align: center;"></h3>
      <p id="picker-tooltip1" style="font-size: 12px; color: gray; margin-bottom: 12px; text-align: center;"></p>
      <div id="picker-list" style="display: flex; flex-direction: column; gap: 6px;"></div>
      <p id="picker-tooltip2" style="font-size: 10px; color: gray; margin-top: 12px; text-align: center;"></p>
    </div>

    <div id="open-all-picker" style="display: none; padding: 6px 0;">
      <h3 id="open-all-title" style="font-size: 15px; margin-bottom: 8px; text-align: center;"></h3>
      <p id="open-all-tooltip1" style="font-size: 12px; color: gray; margin-bottom: 12px; text-align: center;"></p>
      <div id="open-all-list" style="display: flex; flex-direction: column; gap: 6px;"></div>
      <p id="open-all-tooltip2" style="font-size: 10px; color: gray; margin-top: 12px; text-align: center;"></p>
    </div>

    <div id="main-content" style="display: none">
      <div>
        <div style="display: flex; justify-content: space-between">
          <h3>📌 <span data-i18n="activeCategory">활성화 카테고리</span></h3>
          <div id="tool-tips"></div>
        </div>
        <div class="category-box">
          <div
            id="category-box-header"
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;
              cursor: pointer;
            "
          >
            <div style="margin-left: 10px">
              <div id="activeCategory" class="active-category">
                <span><span id="currentCategory">기본</span></span>
              </div>
            </div>
            <div style="display: flex; justify-content: space-between">
              <div
                id="save-tab"
                style="
                  justify-content: center;
                  align-items: center;
                  flex-direction: column;
                  text-align: center;
                "
              >
                <div id="shortcut-save-tab" style="font-size: 9px; color: gray"></div>
                <div style="font-size: 11px; color: gray" data-i18n="saveCurrentTab">현재 탭 저장</div>
              </div>
              <div style="border-left: 1px solid #ccc; margin: 0px 6px"></div>

              <div
                id="save-tabs"
                style="
                  justify-content: center;
                  align-items: center;
                  flex-direction: column;
                  text-align: center;
                "
              >
                <div id="shortcut-save-tabs" style="font-size: 9px; color: gray"></div>
                <div style="font-size: 11px; color: gray" data-i18n="saveAllTabs">전체 탭 저장</div>
              </div>
            </div>
          </div>
          <div id="categoryList" style="padding: 0px; margin-left: 10px"></div>
        </div>
      </div>
      <h3>📌 <span data-i18n="categoryList">카테고리 목록</span></h3>
      <div id="categoryContainer"></div>
      <div id="trashCategoryContainer"></div>

      <button id="addCategoryBtn">+</button>
      <div id="newCategoryInput" class="input-group">
        <input type="text" id="newCategory" data-i18n-placeholder="newCategoryPlaceholder" placeholder="새 카테고리 이름" />
      </div>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
